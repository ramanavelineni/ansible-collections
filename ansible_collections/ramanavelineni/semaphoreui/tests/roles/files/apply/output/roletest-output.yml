---
# A project with an integration that needs no authentication: its webhook URL
# alone starts the task. tests/roles/tasks/apply_output.yml applies it and
# checks whether the URL is printed, and whether a secret below is: each one
# holds roletest-printed-secret. Nothing here is a real address or secret.
name: roletest-output

key_store:
  roletest-none:
    type: none
  roletest-secret-key:
    type: login_password
    login_password:
      login: roletest
      password: roletest-printed-secret-key
  roletest-secret-key-gone:
    state: absent
    login_password:
      login: roletest
      password: roletest-printed-secret-key-gone

repository:
  roletest-repo:
    git_url: https://git.example.com/roletest/site.git
    git_branch: main
    ssh_key: roletest-none

inventory:
  roletest-inventory:
    type: static
    inventory: localhost ansible_connection=local
    ssh_key: roletest-none

variable_group:
  roletest-vars:
    env:
      TZ: UTC
  roletest-secret-vars:
    secrets:
      - name: ROLETEST_SECRET
        value: roletest-printed-secret-group
  roletest-secret-vars-gone:
    state: absent
    secrets:
      - name: ROLETEST_SECRET
        value: roletest-printed-secret-group-gone

template:
  roletest-site:
    repository: roletest-repo
    inventory: roletest-inventory
    variable_groups:
      - roletest-vars
    playbook: site.yml

integration:
  roletest-open:
    template: roletest-site
    auth_method: none
