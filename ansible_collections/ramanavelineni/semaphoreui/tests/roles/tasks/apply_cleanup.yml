---
# Takes everything apply.yml creates off the server. It runs before the test,
# so that what a failed run left behind is no obstacle, and after it.

- name: Delete the projects of the role test
  ramanavelineni.semaphoreui.project:
    name: "{{ item }}"
    state: absent
    confirm_delete: true
  loop:
    - roletest-full
    - roletest-split
    - roletest-unknown
    - roletest-twice
    - roletest-repeated
    - roletest-renamed
    - roletest-output
    - roletest-drift

- name: Delete the users of the role test
  ramanavelineni.semaphoreui.user:
    login: "{{ item }}"
    state: absent
  loop:
    - roletest-user
    - roletest-drift-user

- name: Delete the runners of the role test
  ramanavelineni.semaphoreui.runner:
    name: "{{ item }}"
    state: absent
  loop:
    - roletest-runner
    - roletest-output-runner
