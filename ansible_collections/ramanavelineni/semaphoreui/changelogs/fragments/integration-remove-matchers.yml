---
bugfixes:
  - >-
    integration - a matcher or an extracted value the task no longer lists is deleted first, and the lists are
    read again before anything else is changed. When the server answered the deletion with success but kept the
    entry, the task now fails and says so. Before, it reported a change on every run and returned the
    integration without the entry. In check mode the task warns that it cannot tell.
known_issues:
  - >-
    integration - Semaphore 2.18 and 2.19 with an SQLite database do not remove a matcher or an extracted value
    through the API; they answer the request with success and keep the entry. To drop one on such a server,
    remove the integration with ``state: absent`` and create it again. It gets a new webhook URL then.
