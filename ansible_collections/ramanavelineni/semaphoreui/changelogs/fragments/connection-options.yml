---
minor_changes:
  - >-
    all modules - new connection options ``client_cert`` and ``client_key`` present a TLS client certificate
    to a server that asks for one (mutual TLS). They can also come from ``SEMAPHORE_CLIENT_CERT`` and
    ``SEMAPHORE_CLIENT_KEY``. A path that is not a file, and a ``client_key`` without a ``client_cert``,
    fail before a request is sent.
  - >-
    all modules - new connection option ``use_proxy`` (default ``true``, or ``SEMAPHORE_USE_PROXY``).
    ``false`` reaches the server directly even when ``http_proxy`` or ``https_proxy`` is set in the
    environment. Until now the proxy from the environment was always used.
