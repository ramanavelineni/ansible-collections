---
security_fixes:
  - >-
    All modules - a failed request no longer shows secrets. The request body in ``request_details`` was returned
    as JSON text, where a secret containing a newline, a quote, a backslash or a non-ASCII character is escaped
    and so was not masked: every SSH private key of ``key_store``, and such values of ``variable_group``
    secrets, ``user_password`` and the login ``password``. The body is now returned as a dictionary with secret
    values replaced by ``********``.
breaking_changes:
  - All modules - ``request_details.request`` in a failed result is now a dictionary, not a JSON string.
bugfixes:
  - Add the ``LICENSE`` file to the collection, so that installs and release tarballs include the license text.
  - >-
    All modules - an unexpected error (a server that answers in an unexpected form, a port that doesn't speak
    HTTP) now fails with a message instead of a Python traceback, and the login session is always closed.
  - >-
    integration, inventory, key_store, repository, runner, schedule, team_member, template, variable_group,
    view - ``state=absent`` now reports no change when the project doesn't exist, instead of failing.
  - user - an HTTP 500 on delete is only explained as the pre-2.19 session problem when the server is older than 2.19.
  - template - the survey variable type ``text`` is now refused on every Semaphore older than 2.19, not only on 2.18.
