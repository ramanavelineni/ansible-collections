---
bugfixes:
  - >-
    all modules - a token or password taken from ``SEMAPHORE_API_TOKEN`` or ``SEMAPHORE_PASSWORD`` that the
    server repeats in an error is now taken out of the failure message and of ``request_details.response`` by
    the client itself. Until now this relied on ansible-core masking the result, which the development version
    of ansible-core (2.23.0.dev0) no longer does for values a module registers at run time. No released
    ansible-core version from 2.18 to 2.21 showed such a value.
