---
minor_changes:
  - project - new option ``id``. The module reads only that project, not the list of projects that Semaphore cuts off
    at 200, and renames it when its name differs from ``name``. A missing id fails with ``state=present`` and is no
    change with ``state=absent``.
  - project_info - new option ``id``. It reads only that project and returns it, or an empty list when it does not
    exist or the user cannot see it.
  - project_apply role - a project file may set ``id:``. The project is then read by its id and renamed to ``name``
    when that differs. Every entry of a project now names it by the id the project task returned, so a project with
    an id is found on a server with more than 200 projects.
