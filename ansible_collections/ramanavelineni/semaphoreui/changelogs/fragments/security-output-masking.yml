---
security_fixes:
  - project_backup - the returned ``backup`` and the diff showed each project runner's auth token and every
    integration alias (the secret part of a webhook URL). They are now shown as ``********``. The file
    written at ``dest`` still holds them, and the module documentation no longer says a backup holds no
    secrets.
  - project_apply - the webhook URLs of every integration were printed on every run, and the integrations
    task was not covered by ``project_apply_no_log``. The task is now hidden by ``project_apply_no_log``,
    and only the URLs of integrations created in the run are shown, and only with
    ``project_apply_no_log=false``.
  - server_apply - the runners task, whose result holds a new runner's registration token, was not covered
    by ``server_apply_no_log``, and new tokens were always printed. Both now follow ``server_apply_no_log``.
  - a failed request now masks every ``no_log`` value of the task in what the server answered, as written
    and in the escaped forms JSON from Python and from Go use. Before, only the API token and the password
    were masked there, so a server that repeated a private key or a secret in an error showed it.
