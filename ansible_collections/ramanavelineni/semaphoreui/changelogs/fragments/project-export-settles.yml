---
bugfixes:
  - >-
    project_export role - every key and variable group with a secret is written with
    ``update_secret: on_create``. Applying an exported project again no longer sends its secrets
    and reports a change every run. To push a changed vault value, set ``update_secret: always`` on
    that entry.
  - >-
    project_export role - a file that has the same content and another mode, such as ``0600``, no
    longer counts as a difference that stops the role. Such a file is not written again and keeps
    its mode.
  - >-
    project_export role - ``project_export_overwrite`` no longer replaces the vault file. The role
    writes the vault file only when it does not exist yet, so values filled in by hand stay.
  - >-
    project_export role - ``project_export_project_id`` reads that one project instead of looking for
    it in the list of projects, which Semaphore cuts off at 200. A project is now found by id on any
    server.
  - >-
    project_apply role - two files or directories that declare the same project ``name`` now fail
    before anything changes, and the message names both. Before, both were applied to the one
    project, one after the other.
