---
bugfixes:
  - >-
    semaphoreui modules - a certificate that does not verify, a ``ca_path`` that does not exist and a
    host name that does not resolve now fail at the first request. Before, a read was sent again up
    to ``retries`` times, ``retry_delay`` seconds apart, although asking again cannot fix a setting.
    A refused connection, a timeout and a busy name resolver are still retried.
  - >-
    semaphoreui modules - a pre-release version such as ``v2.19-rc1`` now counts as the tested
    release 2.19. Before, the modules warned that it was untested, while the checks for what a server
    version supports already read it as 2.19.
