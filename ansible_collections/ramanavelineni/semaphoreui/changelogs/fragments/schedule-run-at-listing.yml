---
bugfixes:
  - >-
    schedule - ``run_at`` is sent to Semaphore in UTC (``2026-10-01T03:00:00Z``) instead of exactly as typed,
    so a value YAML read as a timestamp no longer goes out with a space in place of the ``T``. A value that
    is not a date and time, or names no time zone, now fails before anything is changed, with an example of
    an accepted value.
  - >-
    schedule - the template lists are no longer read when the project's schedule list already has the
    schedule of that name, which saves one request per template on every such task. They are still read
    for a commit poller and for a schedule that does not exist yet.
  - >-
    schedule, schedule_info - a schedule that both the project list and a template list return is counted
    once. It used to fail with "More than one schedule is named".
