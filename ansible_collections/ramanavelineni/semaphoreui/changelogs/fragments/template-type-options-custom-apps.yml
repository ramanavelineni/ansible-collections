---
bugfixes:
  - >-
    template - ``start_version`` on a template that is not of type ``build``, and ``build_template`` on one
    that is not of type ``deploy``, now fail with a message naming the option and the type. Semaphore does
    not store them for other types, so the task reported a change on every run while nothing was written.
    An empty value is still accepted for every type.
  - >-
    template - ``app`` no longer has a fixed list of choices, so a template can use an app an administrator
    registered on the Semaphore server. Such an app is checked against the server's app list (a warning
    instead of a failure in check mode), and its ``task_params`` are sent without checking the keys. The
    apps Semaphore ships with behave as before.
  - >-
    template - after an update that changes ``type``, the returned template no longer shows a
    ``start_version`` or ``build_template`` that the new type does not keep.
