---
bugfixes:
  - >-
    all modules - a failure message quotes at most 500 characters of the server's answer and says how much it
    left out. A proxy's error page used to make the message thousands of characters long. The whole answer
    is still returned in ``request_details.response``.
  - >-
    all modules - when the server answers with a redirect, the message names the address it points to and
    says to set ``url`` to the address the server answers on. The address is also returned as
    ``request_details.location``. Redirects are still not followed.
  - >-
    all modules - a ``url`` that does not start with ``http://`` or ``https://`` fails before any request with a
    message showing the expected form, instead of ``unknown url type``.
  - >-
    all modules - ``timeout`` below 1 and a negative ``retries`` or ``retry_delay`` fail before any request.
    ``timeout: 0`` used to fail with "Operation now in progress", and negative ``retries`` and
    ``retry_delay`` were silently read as 0.
