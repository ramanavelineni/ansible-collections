---
bugfixes:
  - >-
    template - an update no longer rewrites the survey variables the task did not change. They go back to the
    server as stored, so fields this module has no option for, such as the ``target`` of Semaphore 2.19, are
    kept. When the task does change ``survey_vars``, a variable that keeps its name keeps those fields too.
  - >-
    template - a template or survey variable whose type this module does not know no longer makes every update
    fail with a ``KeyError``.
  - >-
    template - ``arguments`` the task did not change go back as stored. A stored value that is not a JSON list,
    such as ``-v --diff``, was rewritten as ``["-v --diff"]`` by any other change.
  - >-
    all modules - ``SEMAPHORE_API_TOKEN`` in the environment no longer makes a task that sets ``username`` and
    ``password`` fail with "parameters are mutually exclusive", and ``SEMAPHORE_USERNAME`` or
    ``SEMAPHORE_PASSWORD`` no longer does that to a task that sets ``api_token``. What the task sets wins; the
    environment is read only for what the task leaves out. With nothing set in the task and both kinds in the
    environment, the token is used, where this failed before.
