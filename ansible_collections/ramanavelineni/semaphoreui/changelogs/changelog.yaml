ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: 'First release. 25 modules that manage Semaphore UI 2.18 and
        2.19 declaratively: projects, the Key Store, repositories, inventories, variable
        groups, views, task templates, schedules and commit pollers, integrations,
        team members, runners and users, each with an ``_info`` module. Objects are
        found and referenced by name, only the options you set are compared, and every
        module supports check mode and diff.'
    fragments:
    - 0.1.0.yml
    modules:
    - description: Read Semaphore UI server information and registered apps.
      name: info
      namespace: ''
    - description: Manage integrations (inbound webhooks) in a Semaphore UI project.
      name: integration
      namespace: ''
    - description: List the integrations (inbound webhooks) in a Semaphore UI project.
      name: integration_info
      namespace: ''
    - description: Manage inventories in a Semaphore UI project.
      name: inventory
      namespace: ''
    - description: List the inventories in a Semaphore UI project.
      name: inventory_info
      namespace: ''
    - description: Manage keys in a Semaphore UI project's Key Store.
      name: key_store
      namespace: ''
    - description: List the keys in a Semaphore UI project's Key Store.
      name: key_store_info
      namespace: ''
    - description: Manage Semaphore UI projects.
      name: project
      namespace: ''
    - description: List Semaphore UI projects.
      name: project_info
      namespace: ''
    - description: Manage repositories in a Semaphore UI project.
      name: repository
      namespace: ''
    - description: List the repositories in a Semaphore UI project.
      name: repository_info
      namespace: ''
    - description: Manage Semaphore UI runners.
      name: runner
      namespace: ''
    - description: List Semaphore UI runners.
      name: runner_info
      namespace: ''
    - description: Manage schedules in a Semaphore UI project.
      name: schedule
      namespace: ''
    - description: List the schedules in a Semaphore UI project.
      name: schedule_info
      namespace: ''
    - description: Manage who belongs to a Semaphore UI project, and with which role.
      name: team_member
      namespace: ''
    - description: List the team of a Semaphore UI project.
      name: team_member_info
      namespace: ''
    - description: Manage task templates in a Semaphore UI project.
      name: template
      namespace: ''
    - description: List the task templates in a Semaphore UI project.
      name: template_info
      namespace: ''
    - description: Manage Semaphore UI users.
      name: user
      namespace: ''
    - description: List Semaphore UI users.
      name: user_info
      namespace: ''
    - description: Manage variable groups in a Semaphore UI project.
      name: variable_group
      namespace: ''
    - description: List the variable groups in a Semaphore UI project.
      name: variable_group_info
      namespace: ''
    - description: Manage views (template tabs) in a Semaphore UI project.
      name: view
      namespace: ''
    - description: List the views (template tabs) in a Semaphore UI project.
      name: view_info
      namespace: ''
    release_date: '2026-09-27'
  0.2.0:
    changes:
      breaking_changes:
      - All modules - ``request_details.request`` in a failed result is now a dictionary,
        not a JSON string.
      - inventory_info, project_info, repository_info - fields of the raw API answer
        that the matching module does not return (such as a project's ``created``)
        are no longer returned.
      bugfixes:
      - Add the ``LICENSE`` file to the collection, so that installs and release tarballs
        include the license text.
      - All modules - an unexpected error (a server that answers in an unexpected
        form, a port that doesn't speak HTTP) now fails with a message instead of
        a Python traceback, and the login session is always closed.
      - integration, inventory, key_store, repository, runner, schedule, team_member,
        template, variable_group, view - ``state=absent`` now reports no change when
        the project doesn't exist, instead of failing.
      - inventory_info, project_info, repository_info, user_info - return each object
        in the same form as the matching module, with every field filled in. ``project_info``
        left out ``alert``, ``alert_chat`` and ``max_parallel_tasks`` when they had
        their default value.
      - template - the survey variable type ``text`` is now refused on every Semaphore
        older than 2.19, not only on 2.18.
      - user - an HTTP 500 on delete is only explained as the pre-2.19 session problem
        when the server is older than 2.19.
      release_summary: A security release. A failed request no longer shows secrets,
        and the collection now includes its ``LICENSE``. Also several fixes to the
        client and the ``_info`` modules. Two results changed form, see the breaking
        changes.
      security_fixes:
      - 'All modules - a failed request no longer shows secrets. The request body
        in ``request_details`` was returned as JSON text, where a secret containing
        a newline, a quote, a backslash or a non-ASCII character is escaped and so
        was not masked: every SSH private key of ``key_store``, and such values of
        ``variable_group`` secrets, ``user_password`` and the login ``password``.
        The body is now returned as a dictionary with secret values replaced by ``********``.'
    fragments:
    - 0.2.0.yml
    - info-shapes.yml
    - secret-redaction-license-client-hardening.yml
    release_date: '2026-10-03'
  0.2.1:
    changes:
      bugfixes:
      - integration, inventory, key_store, repository, runner, schedule, team_member,
        template, variable_group, view - check mode no longer fails when the project,
        or another object the task refers to by name, does not exist yet. An earlier
        task of the same run may create it, so the task is reported as changed with
        a warning and an empty result. Outside check mode it fails as before. This
        makes ``--check`` usable for a play that builds a project from nothing.
      release_summary: Check mode now works for a play that builds a project from
        nothing.
    fragments:
    - 0.2.1.yml
    - check-mode-missing-parents.yml
    release_date: '2026-10-03'
