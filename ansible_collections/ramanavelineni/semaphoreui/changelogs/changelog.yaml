  0.2.0:
    changes:
      breaking_changes:
      - All modules - ``request_details.request`` in a failed result is now a dictionary,
        not a JSON string.
      - inventory_info, project_info, repository_info - fields of the raw API answer
        that the matching module does not return (such as a project's ``created``)
        are no longer returned.
      bugfixes:
      - Add the ``LICENSE`` file to the collection, so that installs and release tarballs
        include the license text.
      - All modules - an unexpected error (a server that answers in an unexpected
        form, a port that doesn't speak HTTP) now fails with a message instead of
        a Python traceback, and the login session is always closed.
      - integration, inventory, key_store, repository, runner, schedule, team_member,
        template, variable_group, view - ``state=absent`` now reports no change when
        the project doesn't exist, instead of failing.
      - inventory_info, project_info, repository_info, user_info - return each object
        in the same form as the matching module, with every field filled in. ``project_info``
        left out ``alert``, ``alert_chat`` and ``max_parallel_tasks`` when they had
        their default value.
      - template - the survey variable type ``text`` is now refused on every Semaphore
        older than 2.19, not only on 2.18.
      - user - an HTTP 500 on delete is only explained as the pre-2.19 session problem
        when the server is older than 2.19.
      release_summary: A security release. A failed request no longer shows secrets,
        and the collection now includes its ``LICENSE``. Also several fixes to the
        client and the ``_info`` modules. Two results changed form, see the breaking
        changes.
      security_fixes:
      - 'All modules - a failed request no longer shows secrets. The request body
        in ``request_details`` was returned as JSON text, where a secret containing
        a newline, a quote, a backslash or a non-ASCII character is escaped and so
        was not masked: every SSH private key of ``key_store``, and such values of
        ``variable_group`` secrets, ``user_password`` and the login ``password``.
        The body is now returned as a dictionary with secret values replaced by ``********``.'
    fragments:
    - 0.2.0.yml
    - info-shapes.yml
    - secret-redaction-license-client-hardening.yml
    release_date: '2026-10-03'
  0.2.1:
    changes:
      bugfixes:
      - integration, inventory, key_store, repository, runner, schedule, team_member,
        template, variable_group, view - check mode no longer fails when the project,
        or another object the task refers to by name, does not exist yet. An earlier
        task of the same run may create it, so the task is reported as changed with
        a warning and an empty result. Outside check mode it fails as before. This
        makes ``--check`` usable for a play that builds a project from nothing.
      release_summary: Check mode now works for a play that builds a project from
        nothing.
    fragments:
    - 0.2.1.yml
    - check-mode-missing-parents.yml
    release_date: '2026-10-03'
  0.3.0:
    changes:
      bugfixes:
      - all modules - ``SEMAPHORE_API_TOKEN`` in the environment no longer makes a
        task that sets ``username`` and ``password`` fail with "parameters are mutually
        exclusive", and ``SEMAPHORE_USERNAME`` or ``SEMAPHORE_PASSWORD`` no longer
        does that to a task that sets ``api_token``. What the task sets wins; the
        environment is read only for what the task leaves out. With nothing set in
        the task and both kinds in the environment, the token is used, where this
        failed before.
      - 'all modules - ``timeout`` below 1 and a negative ``retries`` or ``retry_delay``
        fail before any request. ``timeout: 0`` used to fail with "Operation now in
        progress", and negative ``retries`` and ``retry_delay`` were silently read
        as 0.'
      - all modules - a ``url`` that does not start with ``http://`` or ``https://``
        fails before any request with a message showing the expected form, instead
        of ``unknown url type``.
      - all modules - a failure message quotes at most 500 characters of the server's
        answer and says how much it left out. A proxy's error page used to make the
        message thousands of characters long. The whole answer is still returned in
        ``request_details.response``.
      - all modules - when the server answers with a redirect, the message names the
        address it points to and says to set ``url`` to the address the server answers
        on. The address is also returned as ``request_details.location``. Redirects
        are still not followed.
      - inventory, integration, template, variable_group - with ``state=absent`` the
        diff's ``before`` is the whole object, in the shape an update shows, instead
        of only ``id`` and ``name``. The other modules already did this.
      - repository - with ``state=absent`` the diff's ``before`` has the name of the
        SSH key in ``ssh_key`` instead of ``null``.
      - 'runner - check mode with ``regenerate_token: true`` on a registered runner
        now returns ``registered: false`` in ``runner`` and in the diff, as the real
        run does.'
      - runner - the request for a registration token is repeated on a transient failure,
        like the read requests (see ``retries``). It was sent once, so a gateway error
        right after the create left a runner without a token while the task failed,
        and the next run found the runner and returned no token.
      - 'runner - when the token of a new runner still cannot be fetched, the module
        deletes the runner again and says so, so the next run starts over. If the
        delete fails too, the message points to ``regenerate_token: true``.'
      - schedule - ``run_at`` is sent to Semaphore in UTC (``2026-10-01T03:00:00Z``)
        instead of exactly as typed, so a value YAML read as a timestamp no longer
        goes out with a space in place of the ``T``. A value that is not a date and
        time, or names no time zone, now fails before anything is changed, with an
        example of an accepted value.
      - schedule - the template lists are no longer read when the project's schedule
        list already has the schedule of that name, which saves one request per template
        on every such task. They are still read for a commit poller and for a schedule
        that does not exist yet.
      - schedule, schedule_info - a schedule that both the project list and a template
        list return is counted once. It used to fail with "More than one schedule
        is named".
      - template - ``app`` no longer has a fixed list of choices, so a template can
        use an app an administrator registered on the Semaphore server. Such an app
        is checked against the server's app list (a warning instead of a failure in
        check mode), and its ``task_params`` are sent without checking the keys. The
        apps Semaphore ships with behave as before.
      - template - ``arguments`` the task did not change go back as stored. A stored
        value that is not a JSON list, such as ``-v --diff``, was rewritten as ``["-v
        --diff"]`` by any other change.
      - template - ``start_version`` on a template that is not of type ``build``,
        and ``build_template`` on one that is not of type ``deploy``, now fail with
        a message naming the option and the type. Semaphore does not store them for
        other types, so the task reported a change on every run while nothing was
        written. An empty value is still accepted for every type.
      - template - a template or survey variable whose type this module does not know
        no longer makes every update fail with a ``KeyError``.
      - template - after an update that changes ``type``, the returned template no
        longer shows a ``start_version`` or ``build_template`` that the new type does
        not keep.
      - template - an update no longer rewrites the survey variables the task did
        not change. They go back to the server as stored, so fields this module has
        no option for, such as the ``target`` of Semaphore 2.19, are kept. When the
        task does change ``survey_vars``, a variable that keeps its name keeps those
        fields too.
      - variable_group - a stored ``json`` or ``env`` value that is not valid JSON
        no longer blocks the task that replaces it, nor the deletion of the group.
        The diff shows the stored text as ``before``. A task that leaves the broken
        field alone still fails, as an update would write it back.
      minor_changes:
      - all modules - new connection option ``use_proxy`` (default ``true``, or ``SEMAPHORE_USE_PROXY``).
        ``false`` reaches the server directly even when ``http_proxy`` or ``https_proxy``
        is set in the environment. Until now the proxy from the environment was always
        used.
      - all modules - new connection options ``client_cert`` and ``client_key`` present
        a TLS client certificate to a server that asks for one (mutual TLS). They
        can also come from ``SEMAPHORE_CLIENT_CERT`` and ``SEMAPHORE_CLIENT_KEY``.
        A path that is not a file, and a ``client_key`` without a ``client_cert``,
        fail before a request is sent.
      - integration, inventory, key_store, repository, runner, schedule, team_member,
        template, variable_group, view and their ``_info`` modules - new option ``project_id``
        names the project by its id instead of by name with ``project``. The list
        of projects is not read then, only that one project, so these modules work
        on a server with 200 or more projects, where Semaphore cuts the list off and
        a lookup by name is refused. ``project`` and ``project_id`` exclude each other.
      - 'integration, inventory, key_store, repository, schedule, team_member, template,
        variable_group, view and their ``_info`` modules - a task that names no project
        now fails with ``one of the following is required: project, project_id`` instead
        of ``missing required arguments: project``.'
      - 'key_store, schedule, team_member - the rules between options that the argument
        spec can express are now part of it: ``type`` and ``role`` are required with
        ``state=present``, and ``cron`` and ``run_at`` exclude each other. A task
        that breaks one fails during argument validation, before the module logs in,
        with Ansible''s own wording (``state is present but all of the following are
        missing: type``, ``parameters are mutually exclusive: cron|run_at``) instead
        of the module''s.'
      release_summary: 'New connection options (``client_cert``, ``client_key``, ``use_proxy``),
        ``project_id`` as an alternative to the project name, custom apps in ``template``,
        and a round of bug fixes. Some checks are stricter than in 0.2.1 and can make
        a task fail that ran before: ``template`` refuses ``start_version`` and ``build_template``
        on a template type that does not take them, ``schedule`` refuses a ``run_at``
        without a time zone, and negative ``retries`` or ``retry_delay`` are refused.
        Run with ``--check`` once after upgrading.'
    fragments:
    - 0.3.0.yml
    - client-messages-validation.yml
    - connection-options.yml
    - delete-diff-invalid-json.yml
    - module-constraints.yml
    - project-id.yml
    - runner-token.yml
    - schedule-run-at-listing.yml
    - survey-vars-env-credentials.yml
    - template-type-options-custom-apps.yml
    release_date: '2026-10-03'
  0.3.1:
    changes:
      bugfixes:
      - all modules - a token or password taken from ``SEMAPHORE_API_TOKEN`` or ``SEMAPHORE_PASSWORD``
        that the server repeats in an error is now taken out of the failure message
        and of ``request_details.response`` by the client itself. Until now this relied
        on ansible-core masking the result, which the development version of ansible-core
        (2.23.0.dev0) no longer does for values a module registers at run time. No
        released ansible-core version from 2.18 to 2.21 showed such a value.
      - integration - a matcher or an extracted value the task no longer lists is
        deleted first, and the lists are read again before anything else is changed.
        When the server answered the deletion with success but kept the entry, the
        task now fails and says so. Before, it reported a change on every run and
        returned the integration without the entry. In check mode the task warns that
        it cannot tell.
      - 'template - creating a template in check mode returned ``name: null`` in ``template``
        and in the diff. It now returns the name, as a real run does.'
      known_issues:
      - 'integration - Semaphore 2.18 and 2.19 with an SQLite database do not remove
        a matcher or an extracted value through the API; they answer the request with
        success and keep the entry. To drop one on such a server, remove the integration
        with ``state: absent`` and create it again. It gets a new webhook URL then.'
      release_summary: 'Bug fixes found by running the modules against real servers.
        One of them changes what a task does on some servers: ``integration`` now
        fails when a task drops a matcher or an extracted value and the server keeps
        it, where it used to report a change on every run. See the known issue below
        for the servers this applies to.'
    fragments:
    - 0.3.1.yml
    - env-secrets-devel.yml
    - integration-remove-matchers.yml
    - template-check-mode-name.yml
    release_date: '2026-10-04'
  0.4.0:
    changes:
      bugfixes:
      - runner, user_token - the examples used a string as a ``when`` condition, which
        ansible-core 2.19 and later refuse (``Conditional result was derived from
        value of type 'str'``). They now test ``| length > 0``.
      release_summary: New roles that apply whole projects and servers from YAML descriptions
        and export a project as one, six new modules for tasks, project backups, API
        tokens and the event log, and fixes that keep runner tokens, webhook URLs
        and echoed secrets out of task output.
      security_fixes:
      - a failed request now masks every ``no_log`` value of the task in what the
        server answered, as written and in the escaped forms JSON from Python and
        from Go use. Before, only the API token and the password were masked there,
        so a server that repeated a private key or a secret in an error showed it.
      - project_apply - the webhook URLs of every integration were printed on every
        run, and the integrations task was not covered by ``project_apply_no_log``.
        The task is now hidden by ``project_apply_no_log``, and only the URLs of integrations
        created in the run are shown, and only with ``project_apply_no_log=false``.
      - project_backup - the returned ``backup`` and the diff showed each project
        runner's auth token and every integration alias (the secret part of a webhook
        URL). They are now shown as ``********``. The file written at ``dest`` still
        holds them, and the module documentation no longer says a backup holds no
        secrets.
      - server_apply - the runners task, whose result holds a new runner's registration
        token, was not covered by ``server_apply_no_log``, and new tokens were always
        printed. Both now follow ``server_apply_no_log``.
    fragments:
    - apply-roles.yml
    - docs-examples-when.yml
    - release-summary.yml
    - security-output-masking.yml
    modules:
    - description: Read the activity log of Semaphore UI.
      name: event_info
      namespace: ''
    - description: Read a Semaphore UI project's backup, and write it to a file.
      name: project_backup
      namespace: ''
    - description: Create a Semaphore UI project from a backup.
      name: project_restore
      namespace: ''
    - description: Run a Semaphore UI template, or stop a task.
      name: task
      namespace: ''
    - description: Read Semaphore UI tasks and their output.
      name: task_info
      namespace: ''
    - description: Manage the API tokens of the user that logs in.
      name: user_token
      namespace: ''
    objects:
      role:
      - description: Apply a directory of project descriptions to Semaphore UI.
        name: project_apply
        namespace: null
      - description: Write a Semaphore project as the YAML configuration the project\_apply
          role reads.
        name: project_export
        namespace: null
      - description: Apply users and runners to a Semaphore UI server.
        name: server_apply
        namespace: null
    plugins:
      filter:
      - description: Turn what the Semaphore \_info modules return into a project
          configuration.
        name: project_export_config
        namespace: null
      - description: Write the list of vault variables an exported Semaphore project
          needs.
        name: project_export_vault
        namespace: null
      - description: List the vault variables an exported Semaphore project needs.
        name: project_export_vault_variables
        namespace: null
      - description: Write a Semaphore project as the YAML file the project\_apply
          role reads.
        name: project_export_yaml
        namespace: null
    release_date: '2026-10-16'
  0.5.0:
    changes:
      bugfixes:
      - project_apply role - two files or directories that declare the same project
        ``name`` now fail before anything changes, and the message names both. Before,
        both were applied to the one project, one after the other.
      - project_export role - ``project_export_overwrite`` no longer replaces the
        vault file. The role writes the vault file only when it does not exist yet,
        so values filled in by hand stay.
      - project_export role - ``project_export_project_id`` reads that one project
        instead of looking for it in the list of projects, which Semaphore cuts off
        at 200. A project is now found by id on any server.
      - project_export role - a file that has the same content and another mode, such
        as ``0600``, no longer counts as a difference that stops the role. Such a
        file is not written again and keeps its mode.
      - 'project_export role - every key and variable group with a secret is written
        with ``update_secret: on_create``. Applying an exported project again no longer
        sends its secrets and reports a change every run. To push a changed vault
        value, set ``update_secret: always`` on that entry.'
      - project_restore - when Semaphore refuses the name because of a project the
        user can't see, the message no longer says that a re-run will work. It says
        to restore under another name or as an administrator. The documentation says
        that only projects the user can see are found.
      - schedule - a past ``run_at`` for a schedule that is missing or inactive reports
        no change with a warning, instead of failing with HTTP 400 on every run after
        a one-time schedule ran. A past ``run_at`` on an active schedule fails before
        anything is sent.
      - semaphoreui modules - a certificate that does not verify, a ``ca_path`` that
        does not exist and a host name that does not resolve now fail at the first
        request. Before, a read was sent again up to ``retries`` times, ``retry_delay``
        seconds apart, although asking again cannot fix a setting. A refused connection,
        a timeout and a busy name resolver are still retried.
      - semaphoreui modules - a pre-release version such as ``v2.19-rc1`` now counts
        as the tested release 2.19. Before, the modules warned that it was untested,
        while the checks for what a server version supports already read it as 2.19.
      - task - refuse ``task_params.skip_galaxy_install`` when the template does not
        set ``allow_override_skip_galaxy_install`` and the value differs from the
        template's own, because Semaphore ignores it then.
      - template - accept ``secret`` as a survey variable type, which Semaphore 2.18
        and 2.19 offer and the task module's ``secret_variables`` fill. Before, declaring
        the survey variables deleted a secret variable made in the UI, or turned it
        into a plain one. A ``secret`` variable takes no ``default_value``.
      minor_changes:
      - project - new option ``id``. The module reads only that project, not the list
        of projects that Semaphore cuts off at 200, and renames it when its name differs
        from ``name``. A missing id fails with ``state=present`` and is no change
        with ``state=absent``.
      - project_apply role - a project file may set ``id:``. The project is then read
        by its id and renamed to ``name`` when that differs. Every entry of a project
        now names it by the id the project task returned, so a project with an id
        is found on a server with more than 200 projects.
      - project_info - new option ``id``. It reads only that project and returns it,
        or an empty list when it does not exist or the user cannot see it.
      release_summary: Exported projects apply again without changes, projects past
        the first 200 can be reached by id, the roles no longer print webhook URLs
        or registration tokens with -v, and the modules gain secret survey variables,
        settled run_at schedules and a shared transport that stops at once on certificate
        errors.
      security_fixes:
      - project_apply, server_apply - with ``project_apply_no_log`` or ``server_apply_no_log``
        on, a run with ``-v`` printed the skipped items of the tasks that show new
        webhook URLs and registration tokens, the URLs and tokens included. These
        tasks now loop over nothing when no_log is on.
    fragments:
    - project-export-settles.yml
    - project-id.yml
    - release-summary.yml
    - semaphoreui-modules-a7-a8-a14-a16.yml
    - shared-transport.yml
    - show-tasks-verbose-leak.yml
    release_date: '2026-10-17'
