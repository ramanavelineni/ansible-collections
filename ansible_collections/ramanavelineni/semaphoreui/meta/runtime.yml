---
requires_ansible: ">=2.18.0"

# Lets playbooks set the connection options once:
#   module_defaults:
#     group/ramanavelineni.semaphoreui.semaphoreui:
#       url: https://semaphore.example.com
#       api_token: "{{ semaphore_api_token }}"
action_groups:
  semaphoreui:
    - info
    - integration
    - integration_info
    - inventory
    - inventory_info
    - key_store
    - key_store_info
    - project
    - project_info
    - repository
    - repository_info
    - runner
    - runner_info
    - schedule
    - schedule_info
    - team_member
    - team_member_info
    - template
    - template_info
    - user
    - user_info
    - variable_group
    - variable_group_info
    - view
    - view_info
