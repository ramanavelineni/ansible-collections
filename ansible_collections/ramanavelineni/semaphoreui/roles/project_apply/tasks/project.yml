    template: "{{ (item.value | default({}, true)).template | default(omit) }}"
    auth_method: "{{ (item.value | default({}, true)).auth_method | default(omit) }}"
    auth_key: "{{ (item.value | default({}, true)).auth_key | default(omit) }}"
    auth_header: "{{ (item.value | default({}, true)).auth_header | default(omit) }}"
    searchable: "{{ (item.value | default({}, true)).searchable | default(omit) }}"
