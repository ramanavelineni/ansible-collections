  when: (item.value | default({}, true)).state | default('present') == 'absent'
  register: __project_apply_gone_key_store

- name: "Note what was done ({{ __project_apply_project.name }})"
  ansible.builtin.set_fact:
    project_apply_changed: >-
      {{ project_apply_changed | bool
         or (__project_apply_results | map(attribute='changed', default=false) | select | list | length > 0) }}
    project_apply_projects: "{{ project_apply_projects + [__project_apply_project.name] }}"
  vars:
    __project_apply_results:
      - "{{ __project_apply_done_project }}"
      - "{{ __project_apply_done_key_store }}"
      - "{{ __project_apply_done_repository }}"
      - "{{ __project_apply_done_inventory }}"
      - "{{ __project_apply_done_variable_group }}"
      - "{{ __project_apply_done_view }}"
      - "{{ __project_apply_done_template }}"
      - "{{ __project_apply_done_schedule }}"
      - "{{ __project_apply_done_integration }}"
      - "{{ __project_apply_done_team_member }}"
      - "{{ __project_apply_gone_key_store }}"
      - "{{ __project_apply_gone_repository }}"
      - "{{ __project_apply_gone_inventory }}"
      - "{{ __project_apply_gone_variable_group }}"
      - "{{ __project_apply_gone_view }}"
      - "{{ __project_apply_gone_template }}"
      - "{{ __project_apply_gone_schedule }}"
      - "{{ __project_apply_gone_integration }}"
      - "{{ __project_apply_gone_team_member }}"
