    position: "{{ (item.value | default({}, true)).position | default(omit) }}"
    hidden: "{{ (item.value | default({}, true)).hidden | default(omit) }}"
    sort_column: "{{ (item.value | default({}, true)).sort_column | default(omit) }}"
