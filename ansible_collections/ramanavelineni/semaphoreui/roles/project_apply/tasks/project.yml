    project: "{{ __project_apply_project.name }}"
    name: "{{ item.key }}"
    state: absent
  loop: "{{ __project_apply_project.schedule | default({}, true) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: (item.value | default({}, true)).state | default('present') == 'absent'
  register: __project_apply_gone_schedule

