- name: "Show webhook URLs ({{ __project_apply_project.name }})"
  ansible.builtin.debug:
    msg: "{{ item.item.key }}: {{ item.webhook_urls | join(', ') }}"
  loop: "{{ __project_apply_done_integration.results | default([]) | selectattr('webhook_urls', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.key }}"

