# ---- delete (state: absent), reverse order ------------------------------

- name: "Delete team ({{ __project_apply_project.name }})"
  ramanavelineni.semaphoreui.team_member:
    project: "{{ __project_apply_project.name }}"
    user: "{{ item.key }}"
    state: absent
  loop: "{{ __project_apply_project.team_member | default({}, true) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: (item.value | default({}, true)).state | default('present') == 'absent'
  register: __project_apply_gone_team_member

- name: "Delete integrations ({{ __project_apply_project.name }})"
  ramanavelineni.semaphoreui.integration:
    project: "{{ __project_apply_project.name }}"
    name: "{{ item.key }}"
    state: absent
  loop: "{{ __project_apply_project.integration | default({}, true) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: (item.value | default({}, true)).state | default('present') == 'absent'
  register: __project_apply_gone_integration

- name: "Delete schedules ({{ __project_apply_project.name }})"
