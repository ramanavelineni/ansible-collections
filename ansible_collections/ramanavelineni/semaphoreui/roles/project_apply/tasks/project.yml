---
# One project, described by one file or by a directory of files (their
# contents are put together): create or update everything declared, in
# dependency order, then delete the entries marked `state: absent` in the
# reverse order (a schedule before its template, a template before its
# repository). What the project does not mention is left alone.
#
# Every option of each module is passed through. The lists of those options
# are in vars/main.yml; an entry that uses a key its module doesn't have fails
# before anything is changed.

- name: "Find the files of {{ __project_apply_source | basename }}"
  ansible.builtin.find:
    paths: "{{ __project_apply_source }}"
    patterns:
      - "*.yml"
      - "*.yaml"
  register: __project_apply_dir_files
  when: __project_apply_source is directory

- name: "Load {{ __project_apply_source | basename }}"
  ansible.builtin.include_vars:
    file: "{{ item }}"
    name: project_apply_part
  loop: >-
    {{ (__project_apply_dir_files.files | map(attribute='path') | sort)
       if __project_apply_source is directory else [__project_apply_source] }}
  loop_control:
    label: "{{ item | basename }}"
  register: __project_apply_parts
  no_log: "{{ project_apply_no_log | bool }}"

- name: "Check the files of {{ __project_apply_source | basename }}"
  ansible.builtin.assert:
    that:
      - __project_apply_parts.results | length > 0
      - __project_apply_repeated | length == 0
    fail_msg: >-
      {{ __project_apply_source | basename }}:
      {{ 'no .yml or .yaml file in this directory' if __project_apply_parts.results | length == 0
         else 'declared in more than one file: ' ~ (__project_apply_repeated | join(', ')) }}
    quiet: true
  vars:
    # A section may be spread over several files, but each entry (and each
    # project option) is declared in one place.
    __project_apply_repeated: >-
      {%- set seen = {} -%}
      {%- set bad = [] -%}
      {%- for part in __project_apply_parts.results -%}
      {%-   set file = part.item | basename -%}
      {%-   for key, value in part.ansible_facts['project_apply_part'].items() if not key.startswith('_') -%}
      {%-     set ids = [key] -%}
      {%-     if key in __project_apply_sections -%}
      {%-       set ids = (value | default({}, true)).keys() | map('regex_replace', '^', key ~ '.') | list -%}
      {%-     endif -%}
      {%-     for id in ids -%}
      {%-       if id in seen -%}
      {%-         set _ = bad.append(id ~ ' (' ~ seen[id] ~ ', ' ~ file ~ ')') -%}
      {%-       else -%}
      {%-         set _ = seen.update({id: file}) -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ bad }}

- name: "Put together the files of {{ __project_apply_source | basename }}"
  ansible.builtin.set_fact:
    __project_apply_project: >-
      {{ {} | combine(__project_apply_parts.results | map(attribute='ansible_facts.project_apply_part') | list, recursive=true) }}
  no_log: "{{ project_apply_no_log | bool }}"

- name: "Check the name of the project in {{ __project_apply_source | basename }}"
  ansible.builtin.assert:
    that:
      - __project_apply_project.name is defined
      - __project_apply_project.name not in project_apply_protected_projects
    fail_msg: >-
      {{ __project_apply_source | basename }} must set `name`, and must not describe one of the projects in
      project_apply_protected_projects ({{ project_apply_protected_projects | join(', ') }}).
    quiet: true

- name: "Check the option names in {{ __project_apply_source | basename }}"
  ansible.builtin.assert:
    that: __project_apply_unknown | length == 0
    fail_msg: "{{ __project_apply_source | basename }}: unknown option(s) {{ __project_apply_unknown | join(', ') }}"
    quiet: true
  vars:
    __project_apply_unknown: >-
      {%- set bad = [] -%}
      {%- for key in __project_apply_project if not key.startswith('_') and key not in __project_apply_sections
            and key not in __project_apply_options.project -%}
      {%-   set _ = bad.append(key) -%}
      {%- endfor -%}
      {%- for section in __project_apply_sections -%}
      {%-   for name, entry in (__project_apply_project[section] | default({}, true)).items() -%}
      {%-     for key in (entry | default({}, true)) if key not in __project_apply_options[section] -%}
      {%-       set _ = bad.append(section ~ '.' ~ name ~ '.' ~ key) -%}
      {%-     endfor -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ bad }}

- name: "Project {{ __project_apply_project.name }}"
  ramanavelineni.semaphoreui.project:
    name: "{{ __project_apply_project.name }}"
    state: "{{ __project_apply_project.state | default(omit) }}"
    alert: "{{ __project_apply_project.alert | default(omit) }}"
    alert_chat: "{{ __project_apply_project.alert_chat | default(omit) }}"
    max_parallel_tasks: "{{ __project_apply_project.max_parallel_tasks | default(omit) }}"
    confirm_delete: "{{ __project_apply_project.confirm_delete | default(omit) }}"
  register: __project_apply_done_project

# ---- create and update --------------------------------------------------

- name: "Key Store ({{ __project_apply_project.name }})"
  ramanavelineni.semaphoreui.key_store:
    project: "{{ __project_apply_project.name }}"
    name: "{{ item.key }}"
    state: "{{ (item.value | default({}, true)).state | default(omit) }}"
    type: "{{ (item.value | default({}, true)).type | default(omit) }}"
    ssh: "{{ (item.value | default({}, true)).ssh | default(omit) }}"
    login_password: "{{ (item.value | default({}, true)).login_password | default(omit) }}"
    update_secret: "{{ 'on_create' if project_apply_drift_check | bool else ((item.value | default({}, true)).update_secret | default(omit)) }}"
    force_repository_key_update: "{{ (item.value | default({}, true)).force_repository_key_update | default(omit) }}"
  loop: "{{ __project_apply_project.key_store | default({}, true) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: (item.value | default({}, true)).state | default('present') != 'absent'
  register: __project_apply_done_key_store
  no_log: "{{ project_apply_no_log | bool }}"

