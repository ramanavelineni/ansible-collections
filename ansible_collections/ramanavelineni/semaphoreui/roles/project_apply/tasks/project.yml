    arguments: "{{ (item.value | default({}, true)).arguments | default(omit) }}"
    type: "{{ (item.value | default({}, true)).type | default(omit) }}"
    start_version: "{{ (item.value | default({}, true)).start_version | default(omit) }}"
    build_template: "{{ (item.value | default({}, true)).build_template | default(omit) }}"
    autorun: "{{ (item.value | default({}, true)).autorun | default(omit) }}"
    allow_override_args_in_task: "{{ (item.value | default({}, true)).allow_override_args_in_task | default(omit) }}"
    allow_override_branch_in_task: "{{ (item.value | default({}, true)).allow_override_branch_in_task | default(omit) }}"
    allow_parallel_tasks: "{{ (item.value | default({}, true)).allow_parallel_tasks | default(omit) }}"
    suppress_success_alerts: "{{ (item.value | default({}, true)).suppress_success_alerts | default(omit) }}"
