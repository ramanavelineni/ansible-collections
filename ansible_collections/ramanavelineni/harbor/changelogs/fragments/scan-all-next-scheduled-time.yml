bugfixes:
  - >-
    scan_all, scan_all_info - the return docs said ``next_scheduled_time`` is always null. Harbor doesn't
    compute the next run of Scan All: with a schedule it sends ``0001-01-01T00:00:00.000Z``, which the
    modules return as it is. The value is null only without a schedule, or in check mode for ``scan_all``.
