---
bugfixes:
  - >-
    project, project_info - a user who is not a Harbor administrator can now use them. Registries are read only
    for ``proxy_registry`` and proxy-cache projects, and a quota or registry the user may not read (HTTP 401 or 403) is
    returned as ``null``. Setting ``quota_gb`` or ``proxy_registry`` as such a user fails with an explanation.
  - >-
    configuration - ``settings`` values that arrive as strings after templating are accepted: a string of
    digits for an integer setting, and ``true``, ``false``, ``yes``, ``no``, ``on`` or ``off`` for a boolean one.
  - >-
    robot_account - when a new robot account's declared ``secret`` cannot be set, the robot account is deleted
    again and the task fails, instead of leaving a robot whose secret nobody knows.
