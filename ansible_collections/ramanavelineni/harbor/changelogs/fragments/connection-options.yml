---
minor_changes:
  - >-
    all modules - new connection options ``client_cert`` and ``client_key`` present a TLS client certificate
    to a server that asks for one (mutual TLS). They can also come from ``HARBOR_CLIENT_CERT`` and
    ``HARBOR_CLIENT_KEY``. A path that is not a file, and a ``client_key`` without a ``client_cert``, fail
    before a request is sent.
  - >-
    all modules - new connection option ``use_proxy`` (default ``true``, or ``HARBOR_USE_PROXY``). ``false``
    reaches the server directly even when ``http_proxy`` or ``https_proxy`` is set in the environment. Until
    now the proxy from the environment was always used.
bugfixes:
  - >-
    all modules - a ``url`` without ``http://`` or ``https://``, with another scheme or without a host fails
    before a request is sent, with a message showing the expected form. It used to fail with urllib's
    ``unknown url type`` and no hint.
  - >-
    all modules - ``timeout`` below 1 and a negative ``retries`` or ``retry_delay`` fail before a request is
    sent. ``timeout: 0`` used to fail with "Operation now in progress", and a negative ``retries`` or
    ``retry_delay`` was silently read as 0.
  - >-
    all modules - a redirect (HTTP 301, 302, 307, 308) is reported with the address it points to and a hint
    to set ``url`` to the address the Harbor server itself answers on. The target is also returned as
    ``request_details.location``. Redirects are still not followed.
