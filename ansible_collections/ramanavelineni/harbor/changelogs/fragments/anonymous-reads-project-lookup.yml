---
bugfixes:
  - >-
    project - a project is no longer taken for missing on the word of an anonymous answer. Harbor answers
    anonymously for a moment after another client failed to log in as the same user, and its project list then
    leaves out private projects without saying so. ``state: absent`` reported no change for a private project
    that exists, and ``state: present`` tried to create it and failed with HTTP 409. The login is now checked
    again before a project that is not in the list is treated as missing, and the list is read again when
    Harbor was in such a lock. A project that is found costs no request more.
  - >-
    project_info - the list of projects is no longer returned without its private projects while Harbor answers
    anonymously. The login is checked again after the list is read, which is one more request for each task
    that does not name a project that exists.
  - >-
    robot_account, robot_account_info, webhook, webhook_info, tag_retention, tag_retention_info, tag_immutability,
    tag_immutability_info - "Project does not exist" is no longer reported for a private project that Harbor left
    out of an anonymous answer. When Harbor stays anonymous, or is in a lock every time the project is looked up,
    the task fails and says that, instead of acting on what it was shown.
  - >-
    tag_retention, tag_retention_info, tag_immutability, tag_immutability_info - the project is looked up by name
    (``GET /projects?name=``) as the other modules do, instead of reading every project.
