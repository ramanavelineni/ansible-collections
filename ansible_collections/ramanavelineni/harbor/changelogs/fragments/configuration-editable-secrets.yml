---
security_fixes:
  - >-
    configuration, configuration_info - a key that Harbor returns and these modules have no name for is left out of
    ``configuration`` when its name contains ``secret``, ``password``, ``passwd``, ``token``, ``credential`` or
    ``private_key``. The secrets were recognised by a fixed list of names, so a readable secret added by a newer
    Harbor would have been returned in clear text. No Harbor version tested so far returns such a key.
bugfixes:
  - >-
    configuration - changing a setting that Harbor reports as not editable, such as ``auth_mode`` once a second
    user exists, now fails before anything is sent, with the names of those settings. A declared value that is
    already in place is still not a change.
