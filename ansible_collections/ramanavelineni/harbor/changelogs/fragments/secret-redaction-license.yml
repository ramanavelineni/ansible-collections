---
security_fixes:
  - >-
    All modules - a failed request no longer shows secrets. The request body in ``request_details`` was returned
    as JSON text, where a secret containing a quote, a backslash or a non-ASCII character is escaped and so was
    not masked: such values of ``robot_account`` ``secret``, ``registry`` ``access_secret``, ``configuration``
    ``oidc_client_secret`` and ``ldap_search_password``. The body is now returned as a dictionary with secret
    values replaced by ``********``.
  - >-
    webhook - a failed update no longer shows the webhook's stored auth header, which the update sends back to
    Harbor.
breaking_changes:
  - All modules - ``request_details.request`` in a failed result is now a dictionary, not a JSON string.
bugfixes:
  - Add the ``LICENSE`` file to the collection, so that installs and release tarballs include the license text.
