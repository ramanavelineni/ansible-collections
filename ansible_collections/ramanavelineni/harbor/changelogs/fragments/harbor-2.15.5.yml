---
bugfixes:
  - webhook - the address is compared the way Harbor reads it, so a host name in another case or a trailing slash
    is no change. Harbor 2.15.5 stores the address with the host lowercased and without a trailing slash, a user
    or a password, and the module used to report a change on every run for an address it had stored like that.
    A user and password count only where Harbor stored them. The module warns about an address with a user and
    password in it, because Harbor 2.15.5 drops them; send credentials with ``auth_header`` instead.
minor_changes:
  - Harbor 2.15.5 is the tested 2.15 release. The unit-test fixtures for 2.15 are recorded from it, and the role
    tests run against it.
