---
bugfixes:
  - robot_account, webhook, tag_retention, tag_immutability - ``state=absent`` now reports no change when the
    project is already gone. Before, it failed with "Project ... does not exist". For robot_account this applies
    to ``level=project``.
  - robot_account, webhook, tag_retention, tag_immutability, replication, project - in check mode, a task whose
    project or registry does not exist yet now reports a change with a warning and an empty result, because an
    earlier task of the same play may create it. Before, check mode failed. Without check mode the task still
    fails.
  - project - ``quota_gb=0`` now fails with a clear message. Harbor replaces 0 with its default quota per project
    on create and refuses it on update, so every later run failed.
  - project - after a create, the module now warns when the quota Harbor stored differs from ``quota_gb``. When
    the login user may not read quotas, ``quota_gb`` is returned as null with a warning, because Harbor applies
    ``quota_gb`` on create only for a system administrator. Before, such a user got the requested value, which
    Harbor had not stored.
