---
minor_changes:
  - project - the Harbor 2.16 proxy-cache settings ``proxy_cache_filter_kind`` (``doublestar``, ``regex`` or empty),
    ``proxy_cache_filter_pattern`` and ``proxy_referrer_api`` are taken in ``metadata``. They fail on an older
    Harbor, which drops them, and on a project that is not a proxy cache.
  - project - new option ``retention_days`` sets the retention policy that Harbor 2.16 creates with a new
    proxy-cache project. It is only used when the project is created, and fails before Harbor 2.16 and for a
    project that is not a proxy cache.
  - project_apply role - a project file can set ``retention_days``, and passes the new proxy-cache metadata keys to
    the project module like any other.
  - project_export role - the new proxy-cache metadata keys are exported instead of failing the export as unknown.
