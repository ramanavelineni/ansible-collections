---
bugfixes:
  - >-
    project, registry, replication, webhook, tag_retention - the object an update returns, and the ``after`` of
    its diff, are now read back from Harbor after the write instead of being worked out from the options. They
    show what Harbor stored: a ``registry`` update returns the ``status`` of the check Harbor makes on that
    write, where it returned the status from before. ``tag_retention`` reads the policy back after a create
    too. Each update costs one read more, and a ``project`` update that sets ``quota_gb`` two.
  - >-
    project, registry, replication, webhook, tag_retention - when Harbor stored a value differently from what
    the task sent, the task now warns and names the fields, because the next run will find the difference and
    report a change again. Before, the result showed the value the task sent.
  - >-
    tag_retention - a create answered without a ``Location`` header now finds the new policy through the
    project and returns its ``id``, where ``id`` was null.
