ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: 'First release. 23 modules that manage Harbor 2.14 and 2.15
        declaratively: projects, robot accounts, registries, replication rules, webhooks,
        tag retention and immutability, system configuration, and the garbage collection,
        scan-all and audit-log rotation schedules, each with an ``_info`` module.
        Objects are found and referenced by name, only the options you set are compared,
        and every module supports check mode and diff.'
    fragments:
    - 0.1.0.yml
    modules:
    - description: Manage Harbor's system configuration.
      name: configuration
      namespace: ''
    - description: Read Harbor's system configuration.
      name: configuration_info
      namespace: ''
    - description: Manage Harbor's garbage collection schedule.
      name: garbage_collection
      namespace: ''
    - description: Read Harbor's garbage collection schedule and recent runs.
      name: garbage_collection_info
      namespace: ''
    - description: Read Harbor server information.
      name: info
      namespace: ''
    - description: Manage Harbor's audit log rotation schedule.
      name: log_rotation
      namespace: ''
    - description: Read Harbor's audit log rotation schedule and recent purges.
      name: log_rotation_info
      namespace: ''
    - description: Manage Harbor projects.
      name: project
      namespace: ''
    - description: List Harbor projects.
      name: project_info
      namespace: ''
    - description: Manage Harbor registry endpoints.
      name: registry
      namespace: ''
    - description: List Harbor registry endpoints.
      name: registry_info
      namespace: ''
    - description: Manage Harbor replication rules.
      name: replication
      namespace: ''
    - description: List Harbor replication rules.
      name: replication_info
      namespace: ''
    - description: Manage Harbor robot accounts.
      name: robot_account
      namespace: ''
    - description: List Harbor robot accounts.
      name: robot_account_info
      namespace: ''
    - description: Manage Harbor's scheduled vulnerability scan of all artifacts.
      name: scan_all
      namespace: ''
    - description: Read Harbor's Scan All schedule and latest scan metrics.
      name: scan_all_info
      namespace: ''
    - description: Manage a tag immutability rule of a Harbor project.
      name: tag_immutability
      namespace: ''
    - description: List the tag immutability rules of a Harbor project.
      name: tag_immutability_info
      namespace: ''
    - description: Manage a Harbor project's tag retention policy.
      name: tag_retention
      namespace: ''
    - description: Read a Harbor project's tag retention policy.
      name: tag_retention_info
      namespace: ''
    - description: Manage webhooks of a Harbor project.
      name: webhook
      namespace: ''
    - description: List the webhooks of a Harbor project.
      name: webhook_info
      namespace: ''
    release_date: '2026-09-27'
  0.2.0:
    changes:
      breaking_changes:
      - All modules - ``request_details.request`` in a failed result is now a dictionary,
        not a JSON string.
      bugfixes:
      - Add the ``LICENSE`` file to the collection, so that installs and release tarballs
        include the license text.
      - project - ``quota_gb`` on a project that has no quota in Harbor now fails
        with an explanation, instead of being ignored and reported as unchanged.
      - robot_account, robot_account_info - a failed read of Harbor's robot name prefix
        is now reported. Only a user who may not read the configuration (HTTP 401
        or 403) falls back to the default prefix.
      release_summary: A security release. A failed request no longer shows secrets,
        and the collection now includes its ``LICENSE``. Also fixes to ``project``
        quotas and robot account lookups. One result changed form, see the breaking
        changes.
      security_fixes:
      - 'All modules - a failed request no longer shows secrets. The request body
        in ``request_details`` was returned as JSON text, where a secret containing
        a quote, a backslash or a non-ASCII character is escaped and so was not masked:
        such values of ``robot_account`` ``secret``, ``registry`` ``access_secret``,
        ``configuration`` ``oidc_client_secret`` and ``ldap_search_password``. The
        body is now returned as a dictionary with secret values replaced by ``********``.'
      - webhook - a failed update no longer shows the webhook's stored auth header,
        which the update sends back to Harbor.
    fragments:
    - 0.2.0.yml
    - quota-robot-prefix.yml
    - secret-redaction-license.yml
    release_date: '2026-10-03'
