---
requires_ansible: ">=2.18.0"

# Lets playbooks set the connection options once:
#   module_defaults:
#     group/ramanavelineni.harbor.harbor:
#       url: https://harbor.example.com
#       username: admin
#       password: "{{ harbor_admin_password }}"
action_groups:
  harbor:
    - configuration
    - configuration_info
    - garbage_collection
    - garbage_collection_info
    - info
    - log_rotation
    - log_rotation_info
    - project
    - project_info
    - registry
    - registry_info
    - replication
    - replication_info
    - robot_account
    - robot_account_info
    - scan_all
    - scan_all_info
    - tag_immutability
    - tag_immutability_info
    - tag_retention
    - tag_retention_info
    - webhook
    - webhook_info
