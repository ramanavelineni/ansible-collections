---
# Takes everything the export role tests make off the server. It runs before
# a test, so that what a failed run left behind is no obstacle, and after it.
# Harbor removes a project's robot accounts, members and tag rules with the
# project.

- name: Delete the project of the export tests
  ramanavelineni.harbor.project:
    name: roletest-export
    state: absent
    confirm_delete: true

- name: Find the test user
  ansible.builtin.uri:
    url: "{{ export_api }}/users?q=username%3Droletest-export-user&page=1&page_size=100"
    url_username: "{{ export_admin }}"
    url_password: "{{ export_password }}"
    force_basic_auth: true
  register: export_found_users

- name: Delete the test user
  ansible.builtin.uri:
    url: "{{ export_api }}/users/{{ item.user_id }}"
    method: DELETE
    url_username: "{{ export_admin }}"
    url_password: "{{ export_password }}"
    force_basic_auth: true
  loop: "{{ export_found_users.json | default([], true) | selectattr('username', 'equalto', 'roletest-export-user') | list }}"
  loop_control:
    label: "{{ item.username }}"

- name: Find the test group
  ansible.builtin.uri:
    url: "{{ export_api }}/usergroups?group_name=roletest-export-group&page=1&page_size=100"
    url_username: "{{ export_admin }}"
    url_password: "{{ export_password }}"
    force_basic_auth: true
  register: export_found_groups

- name: Delete the test group
  ansible.builtin.uri:
    url: "{{ export_api }}/usergroups/{{ item.id }}"
    method: DELETE
    url_username: "{{ export_admin }}"
    url_password: "{{ export_password }}"
    force_basic_auth: true
  loop: >-
    {{ export_found_groups.json | default([], true)
       | selectattr('group_name', 'equalto', 'roletest-export-group') | list }}
  loop_control:
    label: "{{ item.group_name }}"

- name: Remove the export directory
  ansible.builtin.file:
    path: "{{ export_dir.path }}"
    state: absent
  when: export_dir.path is defined
