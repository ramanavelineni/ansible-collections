---
argument_specs:
  main:
    short_description: Write a Harbor project as the YAML file the project_apply role reads
    description:
      - Reads one project from Harbor with the C(_info) modules of this collection and writes it as YAML, in the
        layout the C(project_apply) role reads. The top of the file holds the project's own options. Below that is
        one section per kind of object, named after the module that manages it, with that module's options.
      - Harbor never returns a robot account's secret, and the role keeps webhook auth headers and Slack webhook
        URLs out of the file. Each becomes a reference to a variable, and the role writes the list of those
        variables, empty, to a second file. Fill them in and keep them in an Ansible Vault file. The exported
        project can be applied as soon as they are defined.
      - Every robot account is written with C(update_secret) set to C(on_create). Applying the export again then
        sends a secret only for a new robot account, and reports no change. To push a changed vault value, set
        C(update_secret) to C(always) on that entry.
      - The same project always gives the same files, so a second run reports no change.
      - A group member's type can only be read by a system administrator. When the project has group members and
        the login user may not read user groups, the role stops before it writes anything.
      - The connection options are not role variables. Set them once with C(module_defaults) for the action group
        C(ramanavelineni.harbor.harbor), or in the environment.
      - Registries, replication rules, system robot accounts and system settings are not part of a project and are
        not exported. A proxy-cache project names its registry, which C(server_apply) has to create first.
    author:
      - ramanavelineni (@ramanavelineni)
    version_added: 0.8.0
    options:
      project_export_project:
        description:
          - Name of the project to export.
        type: str
        required: true
      project_export_dest:
        description:
          - Directory the project is written into, on the host the role runs on.
          - It is created if it does not exist. Point it at the directory the C(project_apply) role reads.
        type: path
        required: true
      project_export_layout:
        description:
          - V(file) writes one file, C(<dest>/<name>.yml).
          - V(directory) writes the directory C(<dest>/<name>/) with C(project.yml) for the project's own options
            and one file per section that has objects, such as C(robot_account.yml).
        type: str
        choices:
          - file
          - directory
        default: file
      project_export_file_name:
        description:
          - Name of the file or directory, without C(.yml).
          - Empty means the name of the project.
        type: str
        default: ""
      project_export_vault_prefix:
        description:
          - What the name of every variable that stands for a secret starts with, in lower case. The name goes on with
            the project, the section, the object and the field, as in C(vault_apps_robot_ci_secret).
        type: str
        default: vault
      project_export_vault_file:
        description:
          - File the variables that stand for secrets are listed in, each empty, with a comment that says what it is
            the secret of.
          - Empty means C(<dest>/<name>.vault.example).
          - The role writes this file only when it does not exist yet. A file that is there is never replaced, also
            not with O(project_export_overwrite). Remove it to get the list again.
          - Inside the directory C(project_apply) reads, its name must not end in C(.yml) or C(.yaml), or it would be
            taken for a project.
        type: path
        default: ""
      project_export_overwrite:
        description:
          - Whether a file that exists and differs from what would be written may be replaced, and a section file of
            a section that has no objects any more removed.
          - Only the content counts. A file with the same content and another mode does not differ.
          - Without it, the role stops before it writes anything and names the files.
          - It never replaces the vault file. See O(project_export_vault_file).
        type: bool
        default: false
      project_export_no_log:
        description:
          - Hide the result of reading the webhooks. It holds their addresses, and a Slack webhook URL is enough to
            post to the channel.
          - This also hides why that read failed. Turn it off to see the reason.
        type: bool
        default: true
      project_export_file_mode:
        description:
          - Mode of the files the role writes.
          - A file that is there with the same content is not written and keeps its mode.
        type: str
        default: "0644"
      project_export_directory_mode:
        description: Mode of the directories the role creates.
        type: str
        default: "0755"
