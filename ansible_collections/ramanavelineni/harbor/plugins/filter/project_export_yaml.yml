---
DOCUMENTATION:
  name: project_export_yaml
  version_added: 0.8.0
  short_description: Write a Harbor project as the YAML file the project_apply role reads
  author:
    - ramanavelineni (@ramanavelineni)
  description:
    - Gives the text of a project file, block style, from what the C(_info) modules of this collection return.
      It is what P(ramanavelineni.harbor.project_export_config#filter) gives, written out, with a comment at the
      top.
    - The same project always gives the same text, keyed objects in the order of their names.
    - A value Harbor stores that looks like a template (it has C({{), C({%) or C({#) in it) is written with the
      C(!unsafe) tag, so that loading the file does not try to render it.
    - Use the result in the same expression that produces it, for example as the C(content) of the C(copy) module.
      Kept in a variable, the references to vault variables in it would be rendered when the variable is used.
  positional: _input, part
  options:
    _input:
      description:
        - The project as the C(_info) modules return it. A mapping with the project under C(project) (one entry of
          RV(ramanavelineni.harbor.project_info#module:projects)), and under the name of each section the result of
          its C(_info) module, C(robot_account) (RV(ramanavelineni.harbor.robot_account_info#module:robot_accounts)),
          C(project_member) (RV(ramanavelineni.harbor.project_member_info#module:members)), C(tag_retention)
          (RV(ramanavelineni.harbor.tag_retention_info#module:tag_retention)), C(tag_immutability)
          (RV(ramanavelineni.harbor.tag_immutability_info#module:tag_immutability)) and C(webhook)
          (RV(ramanavelineni.harbor.webhook_info#module:webhooks)).
        - A section that is missing counts as empty.
      type: dict
      required: true
    vault_prefix:
      description:
        - What the name of every variable that stands for a secret starts with, in lower case. The name goes on with the
          project, the section, the object and the field, as in C(vault_apps_robot_ci_secret).
      type: str
      default: vault
    part:
      description:
        - What to write. Without it, the whole project.
        - V(project) gives the project's own options only, and the name of a section gives that section, for a
          project kept as a directory of files.
        - A section without objects gives an empty text.
      type: str
      choices:
        - project
        - robot_account
        - project_member
        - tag_retention
        - tag_immutability
        - webhook

EXAMPLES: |
  - name: Write the project file
    ansible.builtin.copy:
      dest: config/projects/apps.yml
      mode: "0644"
      content: "{{ exported | ramanavelineni.harbor.project_export_yaml }}"

  - name: Write the members only, for a project kept as a directory
    ansible.builtin.copy:
      dest: config/projects/apps/project_member.yml
      mode: "0644"
      content: "{{ exported | ramanavelineni.harbor.project_export_yaml('project_member') }}"

RETURN:
  _value:
    description: The YAML text, or an empty text for a section without objects.
    type: str
