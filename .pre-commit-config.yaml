---
# Light checks only; ansible-test sanity and unit tests run through
# `make sanity` / `make units` and in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # The role test playbooks use Ansible's !unsafe tag, which a full YAML
      # load rejects. They get a syntax-only check (--unsafe); every other
      # YAML file is still loaded in full, which also catches duplicate keys.
      - id: check-yaml
        exclude: ^ansible_collections/[^/]+/[^/]+/tests/roles/
      - id: check-yaml
        name: check yaml syntax (role tests, with !unsafe)
        args: [--unsafe]
        files: ^ansible_collections/[^/]+/[^/]+/tests/roles/
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: antsibull-changelog-lint
        name: antsibull-changelog lint
        language: python
        additional_dependencies: [antsibull-changelog==0.35.1]
        entry: >-
          bash -c 'for d in ansible_collections/*/*/; do
          (cd "$d" && antsibull-changelog lint) || exit 1; done'
        files: ^ansible_collections/[^/]+/[^/]+/changelogs/
        pass_filenames: false
