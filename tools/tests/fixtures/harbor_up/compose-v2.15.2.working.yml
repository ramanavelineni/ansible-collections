services:
  registry:
    image: goharbor/registry-photon:v2.15.2
    restart: always
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    volumes:
    - /var/home/core/harbor-lab/v2.15.2/data/registry:/storage:z
    - ./common/config/registry/:/etc/registry/:z
    - type: bind
      source: /var/home/core/harbor-lab/v2.15.2/data/secret/registry/root.crt
      target: /etc/registry/root.crt
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
    - harbor
    security_opt:
    - label=disable
  registryctl:
    image: goharbor/harbor-registryctl:v2.15.2
    env_file:
    - ./common/config/registryctl/env
    restart: always
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    volumes:
    - /var/home/core/harbor-lab/v2.15.2/data/registry:/storage:z
    - ./common/config/registry/:/etc/registry/:z
    - type: bind
      source: ./common/config/registryctl/config.yml
      target: /etc/registryctl/config.yml
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
    - harbor
    security_opt:
    - label=disable
  postgresql:
    image: goharbor/harbor-db:v2.15.2
    restart: always
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - SETGID
    - SETUID
    volumes:
    - /var/home/core/harbor-lab/v2.15.2/data/database:/var/lib/postgresql/data:z
    networks:
      harbor: null
    env_file:
    - ./common/config/db/env
    shm_size: 1gb
    security_opt:
    - label=disable
  core:
    image: goharbor/harbor-core:v2.15.2
    env_file:
    - ./common/config/core/env
    restart: always
    cap_drop:
    - ALL
    cap_add:
    - SETGID
    - SETUID
    volumes:
    - /var/home/core/harbor-lab/v2.15.2/data/ca_download/:/etc/core/ca/:z
    - /var/home/core/harbor-lab/v2.15.2/data/:/data/:z
    - ./common/config/core/certificates/:/etc/core/certificates/:z
    - type: bind
      source: ./common/config/core/app.conf
      target: /etc/core/app.conf
    - type: bind
      source: /var/home/core/harbor-lab/v2.15.2/data/secret/core/private_key.pem
      target: /etc/core/private_key.pem
    - type: bind
      source: /var/home/core/harbor-lab/v2.15.2/data/secret/keys/secretkey
      target: /etc/core/key
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
      harbor: null
    depends_on:
    - registry
    - redis
    - postgresql
    security_opt:
    - label=disable
  portal:
    image: goharbor/harbor-portal:v2.15.2
    restart: always
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    volumes:
    - type: bind
      source: ./common/config/portal/nginx.conf
      target: /etc/nginx/nginx.conf
    networks:
    - harbor
    security_opt:
    - label=disable
  jobservice:
    image: goharbor/harbor-jobservice:v2.15.2
    env_file:
    - ./common/config/jobservice/env
    restart: always
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    volumes:
    - /var/home/core/harbor-lab/v2.15.2/data/job_logs:/var/log/jobs:z
    - type: bind
      source: ./common/config/jobservice/config.yml
      target: /etc/jobservice/config.yml
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
    - harbor
    depends_on:
    - core
    security_opt:
    - label=disable
  redis:
    image: docker.io/valkey/valkey:8-alpine
    restart: always
    volumes:
    - /var/home/core/harbor-lab/v2.15.2/data/redis:/var/lib/redis
    networks:
      harbor: null
    security_opt:
    - label=disable
    command:
    - valkey-server
    - --dir
    - /var/lib/redis
  proxy:
    image: goharbor/nginx-photon:v2.15.2
    restart: always
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    volumes:
    - ./common/config/nginx:/etc/nginx:z
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
    - harbor
    ports:
    - 127.0.0.1:8015:8080
    depends_on:
    - registry
    - core
    - portal
    security_opt:
    - label=disable
networks:
  harbor:
    external: false
