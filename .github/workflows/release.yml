---
name: Release

# Pushing a tag <collection>-v<version> (semaphoreui-v0.1.0, harbor-v0.2.0)
# tests that collection at the tagged commit, builds it and publishes a GitHub
# Release with the tarball and the version's changelog. Three jobs, in order:
#   1. "Check <tag>": the tag must be on main and match the version in
#      galaxy.yml, and CHANGELOG.md must already have that version
#      (make changelog COLLECTION=...).
#   2. "Test": the CI workflow for that collection: changelog lint, sanity and
#      unit tests on every supported ansible-core version, the install test,
#      lint and the coverage floor.
#   3. "Publish <tag>": only when all of that passed.
# GitHub marks the newest release as "Latest"; with two collections that is
# whichever was released last.

on:
  push:
    tags:
      - "semaphoreui-v*"
      - "harbor-v*"

permissions:
  contents: read

jobs:
  meta:
    name: Check ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      collection: ${{ steps.meta.outputs.collection }}
      version: ${{ steps.meta.outputs.version }}
      dir: ${{ steps.meta.outputs.dir }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          }

      # The only place the tag is taken apart; the other jobs use the outputs.
      - name: Check the tag against galaxy.yml and CHANGELOG.md
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          collection="${TAG%%-v*}"
          version="${TAG#*-v}"
          dir="ansible_collections/ramanavelineni/${collection}"
          test -f "${dir}/galaxy.yml" || { echo "::error::no collection '${collection}' for tag ${TAG}"; exit 1; }
          declared="$(sed -n 's/^version: *//p' "${dir}/galaxy.yml")"
          if [ "${declared}" != "${version}" ]; then
            echo "::error::tag ${TAG} says ${version}, but ${dir}/galaxy.yml says ${declared}"
            exit 1
          fi
          # CHANGELOG.md escapes the dots: "## v0\.1\.0".
          heading="## v$(printf '%s' "${version}" | sed 's/\./\\./g')"
          grep -qxF "${heading}" "${dir}/CHANGELOG.md" || {
            echo "::error::${dir}/CHANGELOG.md has no v${version} section; run make changelog COLLECTION=${collection}"
            exit 1
          }
          {
            echo "collection=${collection}"
            echo "version=${version}"
            echo "dir=${dir}"
          } >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      collection: ${{ needs.meta.outputs.collection }}

  release:
    name: Publish ${{ github.ref_name }}
    needs: [meta, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - run: pip install "ansible-core>=2.18,<2.22"

      - name: Build the collection
        run: ansible-galaxy collection build "${{ needs.meta.outputs.dir }}" --output-path dist

      - name: Release notes from CHANGELOG.md
        env:
          DIR: ${{ needs.meta.outputs.dir }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          text = open(os.path.join(os.environ['DIR'], 'CHANGELOG.md')).read()
          heading = '## v' + os.environ['VERSION'].replace('.', r'\.')
          section = text.split(heading + '\n', 1)[1]
          section = re.split(r'\n<a id="v[^"]*"></a>\n## v', section)[0]
          section = re.sub(r'<a id="[^"]*"></a>\n', '', section).strip()
          open('notes.md', 'w').write(section + '\n')
          PY
          cat notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${TAG}" dist/*.tar.gz
          --verify-tag
          --title "ramanavelineni.${{ needs.meta.outputs.collection }} ${{ needs.meta.outputs.version }}"
          --notes-file notes.md
