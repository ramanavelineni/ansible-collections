---
name: CI

# Only what a change touches is tested. The first job lists the changed files
# and the other jobs run for the collections among them:
#   - files under one collection: that collection's jobs (changelog lint,
#     sanity and units on each ansible-core version, the install test, lint and
#     coverage)
#   - this workflow, .github/scripts/ or the Makefile: everything
#   - tools/: the recorder tests
#   - Markdown only (READMEs, PLAN.md): nothing; module docs live in the .py
#     files and still count
# "CI result" always runs and fails when any job failed, so it is the one check
# a branch ruleset has to require.
#
# Once a week everything runs for both collections, whatever changed, so a new
# ansible-core patch release that breaks something is noticed without a push.
#
# "Units (..., devel)" runs the unit tests on ansible-core's development
# branch, as an early warning: the test harness uses private ansible-core names
# that a new version may change. It is not part of "CI result" and never blocks
# a merge; only the weekly run turns red when it fails.
#
# "Docs lint (...)" is not part of "CI result" either, for now: it could not
# be run before it was added here, so its first runs show what it reports.
# Once it is green it belongs in the needs of "CI result".
#
# The release workflow calls this one with a collection name. Then nothing is
# compared: that collection's jobs run at the tagged commit, because the last
# push to main may not have touched it and so may not have tested it. The
# devel job is left out there: a release is decided by the supported versions.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # Mondays, 05:17 UTC
  workflow_call:
    inputs:
      collection:
        description: Collection to test whatever changed (semaphoreui or harbor)
        type: string
        required: true

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress. Runs on main are
# never cancelled: each one tests only its own push, so a cancelled run would
# leave that push untested. That takes a group per commit: in a shared group a
# run that is still waiting is cancelled by the next one, whatever
# cancel-in-progress says. Called from the release workflow, github.workflow
# and github.ref are the caller's, so the group is that tag's alone. The weekly
# run has the branch's ref as its group, which no push or pull request uses.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed collections
    runs-on: ubuntu-latest
    outputs:
      collections: ${{ steps.detect.outputs.collections }}
      tools: ${{ steps.detect.outputs.tools }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: List what the change touches
        id: detect
        # Named, so that bash runs with pipefail and a failing script fails the
        # step instead of being hidden by tee.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.collection }}
        run: |
          # Called with a collection (a release): test that one, compare nothing.
          if [ -n "${ONLY}" ]; then
            .github/scripts/ci-changes.sh only "${ONLY}" </dev/null | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi
          # A pull request is checked out as its merge into the base branch, so
          # the first parent is the base. A push is compared with the commit
          # the branch was at before; when that is gone (force push) or there
          # was none, everything runs. The weekly run compares nothing.
          if [ "${EVENT}" = pull_request ]; then
            base="HEAD^1"
          elif [ "${EVENT}" = push ]; then
            base="${BEFORE}"
          else
            base=""
          fi
          if [ -n "${base}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only "${base}" HEAD | .github/scripts/ci-changes.sh | tee -a "${GITHUB_OUTPUT}"
          else
            .github/scripts/ci-changes.sh all </dev/null | tee -a "${GITHUB_OUTPUT}"
          fi

  changelog:
    name: Changelog fragments (${{ matrix.collection }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install antsibull-changelog==0.35.1
      - run: antsibull-changelog lint
        working-directory: ansible_collections/ramanavelineni/${{ matrix.collection }}

  sanity:
    name: Sanity (${{ matrix.collection }}, ${{ matrix.ansible }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
        ansible: [stable-2.18, stable-2.19, stable-2.20, stable-2.21]
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: sanity

  units:
    name: Units (${{ matrix.collection }}, ${{ matrix.ansible }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
        ansible: [stable-2.18, stable-2.19, stable-2.20, stable-2.21]
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: units

  # What someone who downloads a release gets: the tarball is built, installed
  # into an empty directory and used from there (see the script). On the oldest
  # and the newest supported ansible-core, since installing and loading a
  # collection is ansible-core's part.
  install:
    name: Install test (${{ matrix.collection }}, ${{ matrix.ansible }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
        ansible: ["2.18", "2.21"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "ansible-core~=${{ matrix.ansible }}.0"
      - run: .github/scripts/install-test.sh "${{ matrix.collection }}"

  # ansible-lint with the production profile (each collection's .ansible-lint),
  # and the check that the sanity ignore files hold one explained entry per
  # module and nothing else.
  lint:
    name: Lint (${{ matrix.collection }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ansible-lint==26.9.0
      - run: ansible-lint
        working-directory: ansible_collections/ramanavelineni/${{ matrix.collection }}
      - run: .github/scripts/check-sanity-ignore.py "${{ matrix.collection }}"

  # Unit-test coverage of the plugin code, against the floor in the script. One
  # ansible-core version is enough for that, and nothing is sent anywhere.
  coverage:
    name: Coverage (${{ matrix.collection }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
    defaults:
      run:
        working-directory: ansible_collections/ramanavelineni/${{ matrix.collection }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "ansible-core~=2.21.0"
      - run: ansible-test units --venv --python 3.13 --coverage
      - run: ../../../.github/scripts/coverage-floor.sh "${{ matrix.collection }}" --venv --python 3.13

  # The module documentation as a documentation build would read it: markup,
  # links between modules, return value references. Not in the needs of
  # "CI result" yet, see the top of this file.
  docs:
    name: Docs lint (${{ matrix.collection }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install antsibull-docs==2.27.0 "ansible-core~=2.21.0"
      # The checkout has ansible_collections/ at its root, so it is a
      # collections path as it stands.
      - run: >-
          antsibull-docs lint-collection-docs --plugin-docs
          --validate-collection-refs self --disallow-unknown-collection-refs
          "ansible_collections/ramanavelineni/${{ matrix.collection }}"
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}

  # Early warning only. Not in the needs of "CI result", so a failure here
  # cannot block a merge. continue-on-error keeps a failure from turning a push
  # or pull request run red; the weekly run is left to fail, because a red
  # scheduled run is the warning. Units only: sanity on devel would need a
  # tests/sanity/ignore-<version>.txt that exists only for released versions.
  devel:
    name: Units (${{ matrix.collection }}, devel)
    needs: changes
    if: needs.changes.outputs.collections != '[]' && !inputs.collection
    continue-on-error: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: devel
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: units
          coverage: never

  tools:
    name: Recorder tests
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: make tools-test

  result:
    name: CI result
    needs: [changes, changelog, sanity, units, install, lint, coverage, tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
