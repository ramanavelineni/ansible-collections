---
name: CI

# Only what a change touches is tested. The first job lists the changed files
# and the other jobs run for the collections among them:
#   - files under one collection: that collection's jobs (lint, sanity and
#     units on each ansible-core version, the install test, and for semaphoreui
#     the role tests)
#   - this workflow, .github/scripts/ or the Makefile: everything
#   - tools/: the recorder tests
#   - Markdown only (READMEs, PLAN.md): nothing; module docs live in the .py
#     files and still count
# "CI result" always runs and fails when any job failed, so it is the one check
# a branch ruleset has to require.
#
# A pull request runs a little less than a push to main, the weekly run and a
# release do: the install test on the oldest ansible-core only, the role tests
# against the newest Semaphore only, and no run on ansible-core's development
# branch. Sanity and units run on every supported ansible-core everywhere.
#
# "Lint (...)" is four checks in one job: the changelog fragments,
# ansible-lint, the sanity ignore files and the module documentation. Each
# runs whatever the one before it found.
#
# "Units (..., stable-2.21)" also measures how much of the plugin code the unit
# tests cover and fails under the floor in .github/scripts/coverage-floor.sh.
#
# Once a week everything runs for both collections, whatever changed, so a new
# ansible-core patch release that breaks something is noticed without a push.
# Only then "Units (..., devel)" runs the unit tests on ansible-core's
# development branch, as an early warning: the test harness uses private
# ansible-core names that a new version may change. It is not part of
# "CI result"; a red weekly run is the warning.
#
# "Role tests (...)" runs the roles of the semaphoreui collection against a
# throwaway Semaphore that the job starts as a service container: the playbooks
# in the collection's tests/roles/. Roles cannot be tested without a server, so
# unlike the modules' live suites this one is part of CI and of "CI result".
#
# The release workflow calls this one with a collection name. Then nothing is
# compared: that collection's jobs run at the tagged commit, because the last
# push to main may not have touched it and so may not have tested it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # Mondays, 05:17 UTC
  workflow_call:
    inputs:
      collection:
        description: Collection to test whatever changed (semaphoreui or harbor)
        type: string
        required: true

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress. Runs on main are
# never cancelled: each one tests only its own push, so a cancelled run would
# leave that push untested. That takes a group per commit: in a shared group a
# run that is still waiting is cancelled by the next one, whatever
# cancel-in-progress says. Called from the release workflow, github.workflow
# and github.ref are the caller's, so the group is that tag's alone. The weekly
# run has the branch's ref as its group, which no push or pull request uses.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed collections
    runs-on: ubuntu-latest
    outputs:
      collections: ${{ steps.detect.outputs.collections }}
      tools: ${{ steps.detect.outputs.tools }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: List what the change touches
        id: detect
        # Named, so that bash runs with pipefail and a failing script fails the
        # step instead of being hidden by tee.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.collection }}
        run: |
          # Called with a collection (a release): test that one, compare nothing.
          if [ -n "${ONLY}" ]; then
            .github/scripts/ci-changes.sh only "${ONLY}" </dev/null | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi
          # A pull request is checked out as its merge into the base branch, so
          # the first parent is the base. A push is compared with the commit
          # the branch was at before; when that is gone (force push) or there
          # was none, everything runs. The weekly run compares nothing.
          if [ "${EVENT}" = pull_request ]; then
            base="HEAD^1"
          elif [ "${EVENT}" = push ]; then
            base="${BEFORE}"
          else
            base=""
          fi
          if [ -n "${base}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only "${base}" HEAD | .github/scripts/ci-changes.sh | tee -a "${GITHUB_OUTPUT}"
          else
            .github/scripts/ci-changes.sh all </dev/null | tee -a "${GITHUB_OUTPUT}"
          fi

  sanity:
    name: Sanity (${{ matrix.collection }}, ${{ matrix.ansible }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
        ansible: [stable-2.18, stable-2.19, stable-2.20, stable-2.21]
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: sanity

  units:
    name: Units (${{ matrix.collection }}, ${{ matrix.ansible }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
        ansible: [stable-2.18, stable-2.19, stable-2.20]
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: units

  # The newest ansible-core, with coverage: the same unit tests in ansible-test's
  # container, then the floor for the plugin code (see the script). Nothing is
  # sent anywhere.
  units-coverage:
    name: Units (${{ matrix.collection }}, stable-2.21)
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
    defaults:
      run:
        working-directory: ansible_collections/ramanavelineni/${{ matrix.collection }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "ansible-core~=2.21.0"
      - run: ansible-test units --docker --coverage --color yes
      - run: ../../../.github/scripts/coverage-floor.sh "${{ matrix.collection }}" --docker

  # What someone who downloads a release gets: the tarball is built, installed
  # into an empty directory and used from there (see the script). On the oldest
  # and the newest supported ansible-core, since installing and loading a
  # collection is ansible-core's part; a pull request only on the oldest.
  install:
    name: Install test (${{ matrix.collection }}, ${{ matrix.ansible }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
        ansible: ${{ fromJSON(github.event_name == 'pull_request' && '["2.18"]' || '["2.18", "2.21"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "ansible-core~=${{ matrix.ansible }}.0"
      - run: .github/scripts/install-test.sh "${{ matrix.collection }}"

  # Four checks that need no server and no test run, in one job. Each step
  # runs whatever the one before it found, so one run shows everything:
  #   - the changelog fragments
  #   - ansible-lint with the production profile (the collection's .ansible-lint)
  #   - the sanity ignore files: one explained entry per module, nothing else
  #   - the module documentation as a documentation build would read it:
  #     markup, links between modules, return value references
  lint:
    name: Lint (${{ matrix.collection }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
    env:
      # The checkout is a collections path (ansible_collections/ is at its
      # root): ansible-lint and the documentation lint have to find the
      # collection's own modules.
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: >-
          pip install "ansible-core~=2.21.0" antsibull-changelog==0.35.1
          ansible-lint==26.9.0 antsibull-docs==2.27.0
      - name: Changelog fragments
        run: antsibull-changelog lint
        working-directory: ansible_collections/ramanavelineni/${{ matrix.collection }}
      - name: ansible-lint
        if: success() || failure()
        run: ansible-lint
        working-directory: ansible_collections/ramanavelineni/${{ matrix.collection }}
      - name: Sanity ignore files
        if: success() || failure()
        run: .github/scripts/check-sanity-ignore.py "${{ matrix.collection }}"
      - name: Module documentation
        if: success() || failure()
        run: >-
          antsibull-docs lint-collection-docs --plugin-docs
          --validate-collection-refs self --disallow-unknown-collection-refs
          "ansible_collections/ramanavelineni/${{ matrix.collection }}"

  # The roles, run for real: every playbook in the collection's tests/roles/
  # against a Semaphore started for this job (see .github/scripts/role-test.sh
  # and the playbooks). Each tested Semaphore version runs once, the older one
  # with the oldest supported ansible-core and the newer one with the newest,
  # because a role is templating, and templating changed between those. A pull
  # request runs only the newer pair. The server and its admin password exist
  # only for the run; the password is no secret.
  roles:
    name: Role tests (semaphoreui, Semaphore ${{ matrix.semaphore }}, ansible-core ${{ matrix.ansible }})
    needs: changes
    if: needs.changes.outputs.collections != '[]' && contains(needs.changes.outputs.collections, '"semaphoreui"')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
              && '[{"semaphore": "v2.19.12", "ansible": "2.21"}]'
              || '[{"semaphore": "v2.18.30", "ansible": "2.18"}, {"semaphore": "v2.19.12", "ansible": "2.21"}]') }}
    services:
      semaphore:
        image: docker.io/semaphoreui/semaphore:${{ matrix.semaphore }}
        env:
          SEMAPHORE_DB_DIALECT: sqlite
          SEMAPHORE_ADMIN: admin
          SEMAPHORE_ADMIN_PASSWORD: roletest-${{ github.run_id }}-${{ github.run_attempt }}
          SEMAPHORE_ADMIN_NAME: Admin
          SEMAPHORE_ADMIN_EMAIL: admin@localhost
        ports:
          - 3000:3000
    env:
      SEMAPHORE_URL: http://127.0.0.1:3000
      SEMAPHORE_USERNAME: admin
      SEMAPHORE_PASSWORD: roletest-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "ansible-core~=${{ matrix.ansible }}.0"
      - name: Wait for Semaphore
        run: |
          for try in $(seq 1 60); do
            if curl -fsS -o /dev/null "${SEMAPHORE_URL}/api/ping"; then
              echo "Semaphore answers after ${try} tries"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Semaphore did not answer on ${SEMAPHORE_URL}/api/ping within 2 minutes"
          exit 1
      - run: .github/scripts/role-test.sh semaphoreui

  # Early warning only, in the weekly run: the unit tests on ansible-core's
  # development branch. Not in the needs of "CI result". Units only: sanity on
  # devel would need a tests/sanity/ignore-<version>.txt that exists only for
  # released versions.
  devel:
    name: Units (${{ matrix.collection }}, devel)
    needs: changes
    if: needs.changes.outputs.collections != '[]' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: devel
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: units
          coverage: never

  tools:
    name: Recorder tests
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: make tools-test

  result:
    name: CI result
    needs: [changes, sanity, units, units-coverage, install, lint, roles, tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
