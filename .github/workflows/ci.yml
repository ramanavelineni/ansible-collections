---
name: CI

# Only what a change touches is tested. The first job lists the changed files
# and the other jobs run for the collections among them:
#   - files under one collection: that collection's 9 jobs
#   - this workflow, .github/scripts/ or the Makefile: everything
#   - tools/: the recorder tests
#   - Markdown only (READMEs, PLAN.md): nothing; module docs live in the .py
#     files and still count
# "CI result" always runs and fails when any job failed, so it is the one check
# a branch ruleset has to require.
#
# The release workflow calls this one with a collection name. Then nothing is
# compared: that collection's 9 jobs run at the tagged commit, because the last
# push to main may not have touched it and so may not have tested it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      collection:
        description: Collection to test whatever changed (semaphoreui or harbor)
        type: string
        required: true

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress. Runs on main are
# never cancelled: each one tests only its own push, so a cancelled run would
# leave that push untested. That takes a group per commit: in a shared group a
# run that is still waiting is cancelled by the next one, whatever
# cancel-in-progress says. Called from the release workflow, github.workflow
# and github.ref are the caller's, so the group is that tag's alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed collections
    runs-on: ubuntu-latest
    outputs:
      collections: ${{ steps.detect.outputs.collections }}
      tools: ${{ steps.detect.outputs.tools }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: List what the change touches
        id: detect
        # Named, so that bash runs with pipefail and a failing script fails the
        # step instead of being hidden by tee.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.collection }}
        run: |
          # Called with a collection (a release): test that one, compare nothing.
          if [ -n "${ONLY}" ]; then
            .github/scripts/ci-changes.sh only "${ONLY}" </dev/null | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi
          # A pull request is checked out as its merge into the base branch, so
          # the first parent is the base. A push is compared with the commit
          # the branch was at before; when that is gone (force push) or there
          # was none, everything runs.
          if [ "${EVENT}" = pull_request ]; then
            base="HEAD^1"
          else
            base="${BEFORE}"
          fi
          if git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only "${base}" HEAD | .github/scripts/ci-changes.sh | tee -a "${GITHUB_OUTPUT}"
          else
            .github/scripts/ci-changes.sh all </dev/null | tee -a "${GITHUB_OUTPUT}"
          fi

  changelog:
    name: Changelog fragments (${{ matrix.collection }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install antsibull-changelog==0.35.1
      - run: antsibull-changelog lint
        working-directory: ansible_collections/ramanavelineni/${{ matrix.collection }}

  sanity:
    name: Sanity (${{ matrix.collection }}, ${{ matrix.ansible }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
        ansible: [stable-2.18, stable-2.19, stable-2.20, stable-2.21]
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: sanity

  units:
    name: Units (${{ matrix.collection }}, ${{ matrix.ansible }})
    needs: changes
    if: needs.changes.outputs.collections != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.changes.outputs.collections) }}
        ansible: [stable-2.18, stable-2.19, stable-2.20, stable-2.21]
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: units

  tools:
    name: Recorder tests
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: make tools-test

  result:
    name: CI result
    needs: [changes, changelog, sanity, units, tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
