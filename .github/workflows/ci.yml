---
name: CI

# A change that only touches Markdown (READMEs, PLAN.md) has nothing for
# ansible-test to check, so it doesn't start the 9 jobs. Module docs live
# in the .py files and still trigger a run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog fragments (${{ matrix.collection }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: [semaphoreui]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install antsibull-changelog==0.35.1
      - run: antsibull-changelog lint
        working-directory: ansible_collections/ramanavelineni/${{ matrix.collection }}

  sanity:
    name: Sanity (${{ matrix.collection }}, ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: [semaphoreui]
        ansible: [stable-2.18, stable-2.19, stable-2.20, stable-2.21]
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: sanity

  units:
    name: Units (${{ matrix.collection }}, ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: [semaphoreui]
        ansible: [stable-2.18, stable-2.19, stable-2.20, stable-2.21]
    steps:
      - uses: ansible-community/ansible-test-gh-action@v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          collection-root: ansible_collections/ramanavelineni/${{ matrix.collection }}
          testing-type: units
